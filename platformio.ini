; PlatformIO Project Configuration — Wildlife Camera Node
; Hardware spec: PROJECT_BRIEF.md (authoritative — do not contradict it here).
;
; WHY NOT THE STOCK espressif32 PLATFORM:
;   PROJECT_BRIEF.md 9.2 requires Espressif's ESP-WHO human detection. The
;   detection models ship as ESP-IDF managed components (espressif/esp-dl and
;   the model packages), and esp-dl >= 3.0 requires ESP-IDF >= 5.3. The stock
;   PlatformIO `espressif32` platform is pinned to Arduino 2.0.17 / IDF 4.4.7,
;   so esp-dl cannot be built there at all. The pioarduino fork below provides
;   Arduino core 3.3.11 on ESP-IDF 5.5.5 and the `custom_component_add` /
;   `custom_sdkconfig` options needed to pull the components in.
;
;   First build downloads a new toolchain + IDF (~2 GB, slow). Subsequent
;   builds are normal speed.

[platformio]
default_envs = wildlife

; ---------------------------------------------------------------------------
; Common: board, PSRAM, partitions
; ---------------------------------------------------------------------------
[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino

; --- PSRAM, explicitly ------------------------------------------------------
; The XIAO ESP32S3 carries an ESP32-S3R8: 8 MB of *octal* SPI PSRAM. The board
; manifest already implies this via memory_type=qio_opi, but per the task it is
; spelled out here so the build cannot silently lose it.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L

; Single 6 MB app slot, no OTA. The stock default_8MB.csv splits flash into two
; 3.3 MB OTA slots, which esp-dl + a detection model + Arduino + WiFi will not
; reliably fit into.
board_build.partitions = partitions_wildlife.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600

; CONFIG_ASYNC_TCP_STACK_SIZE: deployment mode pulls camera frames from inside
; the AsyncTCP task. The fork's 8 KB default leaves little margin once
; esp_camera_fb_get() is on that stack; 16 KB of internal RAM is cheap here
; because no detection model is resident in that mode.
build_flags =
	-DBOARD_HAS_PSRAM
	-DCORE_DEBUG_LEVEL=3
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DCONFIG_ASYNC_TCP_STACK_SIZE=16384

; Deployment mode only (src/deploy_mode.cpp). The ESP32Async fork is the
; maintained one and the only one that builds against Arduino core 3.x;
; me-no-dev/ESPAsyncWebServer is stuck on core 2.x. Both are pinned to the
; exact versions that were tested, so a build months from now gets the same
; pair; a caret (^3.12.1) would take any later 3.x. AsyncTCP comes first
; because lib_deps install in order: ESPAsyncWebServer's library.json asks for
; AsyncTCP ^3.5.0, and with the pinned copy already installed that is
; satisfied instead of fetching the newest 3.x alongside it.
lib_deps =
	esp32async/AsyncTCP@3.5.0
	esp32async/ESPAsyncWebServer@3.12.1

; ---------------------------------------------------------------------------
; Detection-capable build (rebuilds ESP-IDF from source against the sdkconfig
; below, then relinks the Arduino libs — this is what `custom_sdkconfig` does).
; ---------------------------------------------------------------------------
[detect_base]
extends = env

; src/ is compiled by the Arduino/SCons side, which does not inherit the
; managed components' INCLUDE_DIRS. This puts esp-dl's headers on the path.
;
; The second script is the other half of the same seam: the components are
; built and installed, but never named on the link line, so esp-dl's symbols
; come back undefined at link time. Its header has the full diagnosis.
extra_scripts =
	pre:tools/esp_dl_includes.py
	post:tools/esp_dl_link.py

; CONFIG_ESP_TASK_WDT_TIMEOUT_S is a Kconfig child of CONFIG_ESP_TASK_WDT_INIT,
; so turning the task watchdog off below deletes it from sdkconfig.h entirely.
; AsyncTCP uses it unconditionally to bound how long its task may block:
;   #define ASYNC_TCP_MAX_TASK_SLEEP (pdMS_TO_TICKS(1000 * CONFIG_ESP_TASK_WDT_TIMEOUT_S) / 4)
; With no watchdog to feed that is now just a wake-at-least-every-1.25 s bound,
; so hand it the stock value the prebuilt libs use. Scoped to this section
; because only the custom_sdkconfig builds lose the macro; bench-nodetect gets
; it from the prebuilt sdkconfig.h as usual.
build_flags =
	${env.build_flags}
	-DCONFIG_ESP_TASK_WDT_TIMEOUT_S=5


custom_sdkconfig =
	CONFIG_SPIRAM=y
	CONFIG_SPIRAM_MODE_OCT=y
	CONFIG_SPIRAM_TYPE_AUTO=y
	CONFIG_SPIRAM_SPEED_80M=y
	CONFIG_SPIRAM_BOOT_INIT=y
	CONFIG_SPIRAM_IGNORE_NOTFOUND=n
	CONFIG_SPIRAM_USE_MALLOC=y
	CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL=4096
	CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL=32768
	CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP=y
	CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB=y
	CONFIG_ESP32S3_DATA_CACHE_64KB=y
	CONFIG_ESP32S3_DATA_CACHE_LINE_64B=y
	CONFIG_ESP_DEFAULT_CPU_FREQ_MHZ_240=y
	CONFIG_ESP_SLEEP_PSRAM_LEAKAGE_WORKAROUND=y
	CONFIG_ESP_SLEEP_FLASH_LEAKAGE_WORKAROUND=y
	CONFIG_ESP_TASK_WDT_INIT=n
	CONFIG_COMPILER_OPTIMIZATION_PERF=y
	CONFIG_BT_ENABLED=n

; ---------------------------------------------------------------------------
; env:wildlife — default. Pedestrian (whole-body) detection.
; ---------------------------------------------------------------------------
[env:wildlife]
extends = detect_base
custom_component_add = espressif/pedestrian_detect@0.3.2
build_flags =
	${detect_base.build_flags}
	-DDETECTION_ENABLED=1
	-DDETECT_MODEL=DETECT_MODEL_PEDESTRIAN

; ---------------------------------------------------------------------------
; env:wildlife-face — same firmware, face model instead. Shorter range, much
; stricter: only fires on a face actually turned toward the lens.
; ---------------------------------------------------------------------------
[env:wildlife-face]
extends = detect_base
custom_component_add = espressif/human_face_detect@0.5.0
build_flags =
	${detect_base.build_flags}
	-DDETECTION_ENABLED=1
	-DDETECT_MODEL=DETECT_MODEL_FACE

; ---------------------------------------------------------------------------
; env:bench-nodetect — no esp-dl, stock prebuilt Arduino libs, fast to build.
; This is the build for PROJECT_BRIEF.md 11 step 5: confirm the AO3401A load
; switch actually kills camera power and measure sleep current, before taking
; on the esp-dl toolchain. Bursts are buffered and discarded, never detected.
; ---------------------------------------------------------------------------
[env:bench-nodetect]
extends = env
build_flags =
	${env.build_flags}
	-DDETECTION_ENABLED=0
